name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio pyserial

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware for all nodes
        run: pio run -e node1 -e node2 -e node3 -e node1_debug

      - name: Check monitor script
        run: python -m py_compile tools/multi_monitor.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/node*/firmware.bin
