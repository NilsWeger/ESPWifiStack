; ESP-NOW multi-node test for ESP8266 boards.
;
; Build and flash one board per env, each gets its own NODE_ID:
;   pio run -e node1 -t upload --upload-port /dev/ttyUSB0
;   pio run -e node2 -t upload --upload-port /dev/ttyUSB1
; Host unit tests:
;   pio test -e native

[platformio]
default_envs = node1, node2, node3
; Per-machine serial ports live in platformio_local.ini (not committed).
; Copy platformio_local.ini.example to platformio_local.ini and edit it.
extra_configs = platformio_local.ini

; Test parameters shared by all nodes. All nodes must use the same channel.
[common]
build_flags =
    -Wall
    -Wextra
    -DESPNOW_CHANNEL=1
    -DPING_INTERVAL_MS=200
    -DHELLO_INTERVAL_MS=2000
    -DREPORT_INTERVAL_MS=5000
    -DPAYLOAD_SIZE=0

[esp8266]
platform = espressif8266@^4.2.1
framework = arduino
; Wemos/Lolin D1 mini. For NodeMCU v2/v3 use: board = nodemcuv2
board = d1_mini
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp8266_exception_decoder, time
build_flags = ${common.build_flags}

; Serial ports per node: see platformio_local.ini.example.
[env:node1]
extends = esp8266
build_flags = ${esp8266.build_flags} -DNODE_ID=1

[env:node2]
extends = esp8266
build_flags = ${esp8266.build_flags} -DNODE_ID=2

[env:node3]
extends = esp8266
build_flags = ${esp8266.build_flags} -DNODE_ID=3

; Debug build: exception decoder gets line numbers, core debug output enabled.
[env:node1_debug]
extends = esp8266
build_type = debug
build_flags = ${esp8266.build_flags} -DNODE_ID=1 -DDEBUG_ESP_PORT=Serial -DDEBUG_ESP_WIFI

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
